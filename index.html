<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keystone demo</title>
<script>(function(){try{var c=localStorage.getItem("ks_theme")||"system";var d=c==="dark"||(c==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-theme",d?"dark":"light");
if(localStorage.getItem("ks_demo_ok")==="10456"){location.replace(sessionStorage.getItem("ks_demo_return")||"/keystone-demo/dashboard/");}}catch(e){}})();</script>
<style>
:root{--bg:#f1f4f8;--surface:#fff;--ink:#0d1726;--muted:#55657a;--faint:#8a99ac;--line:#e2e8f0;--brand:#2a78d6;--critical:#d03b3b}
:root[data-theme=dark]{--bg:#0b1220;--surface:#111a2b;--ink:#e6edf7;--muted:#9fb0c6;--faint:#6b7d95;--line:#223047;--brand:#5b9bea}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
background-image:radial-gradient(60% 50% at 20% 0%,rgba(42,120,214,.18),transparent 60%),radial-gradient(50% 40% at 90% 100%,rgba(12,163,12,.12),transparent 60%)}
.card{width:min(380px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 28px 24px;box-shadow:0 16px 32px -12px rgba(13,23,38,.2),0 4px 10px -4px rgba(13,23,38,.08)}
.mark{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.mark i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:#0d1726;color:#fff;font:700 16px/1 system-ui;font-style:normal}
.mark b{font-size:18px;font-weight:600}.mark small{display:block;color:var(--faint);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
h1{font-size:17px;margin:0 0 4px;font-weight:600}p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
input{width:100%;font:600 22px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.35em;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(42,120,214,.2)}
button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:10px;background:var(--brand);color:#fff;font:600 14px system-ui;cursor:pointer}
button:hover{filter:brightness(1.08)}
.err{min-height:18px;margin-top:10px;font-size:12.5px;color:var(--critical);text-align:center}
.foot{margin-top:16px;font-size:11.5px;color:var(--faint);text-align:center}
.shake{animation:sh .35s}@keyframes sh{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
</style></head><body>
<form class="card" id="f" autocomplete="off">
 <div class="mark"><i>K</i><div><b>Keystone</b><small>Roofing CRM · demo</small></div></div>
 <h1>Enter your access code</h1>
 <p>This is a read-only walkthrough with sample data. Nothing you click changes anything.</p>
 <label for="code">Access code</label>
 <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="•••••" autofocus>
 <button type="submit">Open the demo</button>
 <div class="err" id="err"></div>
 <div class="foot">Sample company: Apex Roofing &amp; Restoration</div>
</form>
<script>
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
 var v=document.getElementById('code').value.trim();
 if(v==="10456"){try{localStorage.setItem('ks_demo_ok',v)}catch(x){}
  location.href=sessionStorage.getItem('ks_demo_return')||"/keystone-demo/dashboard/";}
 else{var c=document.getElementById('f');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
  document.getElementById('err').textContent="That code didn't match.";document.getElementById('code').select();}
});
</script></body></html>
